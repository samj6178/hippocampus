###############################################################################
# Hippocampus MOS — One-command setup: docker compose up
#
# Services:
#   ollama       — Local embedding model (nomic-embed-text, 274MB)
#   hippocampus  — Memory system (SQLite, MCP + REST)
#
# First run pulls the model automatically (~2 min on fast internet).
# Data persisted in named volumes — survives docker compose down.
###############################################################################

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # Pull the embedding model on first start. Exits 0 when done.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    restart: "no"

  hippocampus:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      LOG_LEVEL: "info"
    volumes:
      - hippocampus_data:/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  ollama_data:
  hippocampus_data:
